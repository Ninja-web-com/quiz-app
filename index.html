<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-950 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8" id="quiz-box">
    <div id="start-screen" class="text-center">
      <h1 class="text-3xl font-bold text-slate-800 mb-4">JavaScript Quiz</h1>
      <p class="text-slate-500 mb-8">Test your basic JavaScript knowledge</p>
      <button onclick="startQuiz()" class="bg-indigo-600 text-white px-8 py-3 rounded-full font-semibold hover:bg-indigo-700">Start Quiz</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div class="flex justify-between text-sm text-slate-500 mb-4">
        <span id="question-number">Question 1/5</span>
        <span id="score-display">Score: 0</span>
      </div>
      <h2 id="question" class="text-xl font-semibold text-slate-800 mb-6"></h2>
      <div id="options" class="space-y-3"></div>
    </div>

    <div id="result-screen" class="hidden text-center">
      <h2 class="text-3xl font-bold text-slate-800 mb-2">Quiz Completed!</h2>
      <p class="text-5xl font-bold text-indigo-600 my-6" id="final-score">0/5</p>
      <button onclick="location.reload()" class="bg-indigo-600 text-white px-8 py-3 rounded-full font-semibold">Play Again</button>
    </div>
  </div>

  <script>
    const questions = [
      { q: "What does DOM stand for?", options: ["Document Object Model", "Data Object Model", "Document Oriented Model", "Digital Object Model"], answer: 0 },
      { q: "Which keyword declares a constant?", options: ["var", "let", "const", "constant"], answer: 2 },
      { q: "What is the correct way to write an array?", options: ["var colors = (1,2,3)", "var colors = [1,2,3]", "var colors = {1,2,3}", "var colors = 1,2,3"], answer: 1 },
      { q: "Which method adds an element at the end of an array?", options: ["push()", "pop()", "shift()", "unshift()"], answer: 0 },
      { q: "What is === operator?", options: ["Assignment", "Equality with type check", "Not equal", "Greater than"], answer: 1 }
    ];

    let current = 0, score = 0;

    function startQuiz() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      showQuestion();
    }

    function showQuestion() {
      const q = questions[current];
      document.getElementById('question-number').innerText = `Question ${current+1}/${questions.length}`;
      document.getElementById('score-display').innerText = `Score: ${score}`;
      document.getElementById('question').innerText = q.q;
      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'w-full text-left p-4 rounded-xl border border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 transition';
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(i);
        optionsDiv.appendChild(btn);
      });
    }

    function selectAnswer(index) {
      if (index === questions[current].answer) score++;
      current++;
      if (current < questions.length) showQuestion();
      else {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score}/${questions.length}`;
      }
    }
  </script>
</body>
</html>
